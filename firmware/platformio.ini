; Конфігурація PlatformIO для прошивки SvitloBot.
; Збирання: pio run
; Готові об'єднані образи для CLI: python ../cli/scripts/build_firmware.py

[platformio]
default_envs = esp32dev, esp32s3

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = default.csv
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -DFW_VERSION=\"0.3.0\"
    -DCORE_DEBUG_LEVEL=0

; Класичний ESP32 (DevKit, WROOM-32)
[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DLED_PIN=2

; ESP32-S3. Образ для 4 МБ flash — підходить і для плат з 8/16 МБ.
; Serial — апаратний UART0 (через USB-UART міст на платі, напр. CH343/CP2102).
[env:esp32s3]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.flash_mode = dio
build_flags =
    ${env.build_flags}
    -DLED_PIN=2
    -DARDUINO_USB_CDC_ON_BOOT=0
