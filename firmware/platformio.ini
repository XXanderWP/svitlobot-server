; Конфігурація PlatformIO для прошивки SvitloBot ESP32.
; Збирання: pio run
; Готовий об'єднаний образ для CLI: python ../cli/scripts/build_firmware.py

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = default.csv
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -DFW_VERSION=\"0.1.0\"
    -DLED_PIN=2
    -DCORE_DEBUG_LEVEL=0
